name = "Guest"
version = "0.1.0"
defaultTargets = ["Guest"]

# Pinned to flapjack main after PR 661 (`Flapjack.PanValueFfiClockFuel`), which
# together with `Flapjack.PanValueFfiFuel` upstreams what used to live here as
# `Guest/StepCalculus.lean`. Bump deliberately (and re-check lean-toolchain
# compatibility) rather than tracking main unpinned.
[[require]]
name = "flapjack"
git = "https://github.com/flamingoponderado/flapjack"
rev = "2732831e21be0a32e3135417f39563cc1124a8d4"

# ZisK accelerator semantics (RiscvZkvm.Rv64.ZiskAccel: Keccak-f, SHA-256
# compress, Arith256/384Mod, secp256k1/BN254/BLS12-381 affine ops, BLAKE2b
# round), shared with evm-asm. Only the mathlib-free RiscvZkvm.Rv64 library is
# imported.
[[require]]
name = "riscv-zkvm"
git = "https://github.com/Verified-zkEVM/riscv-zkvm"
rev = "v0.3.0"

[[lean_lib]]
name = "Guest"

# `lake exe gen-guest-ast Guest/guest.pp.pnk > Guest/Ast.lean` regenerates the
# committed AST of the guest (see tools/gen-guest-ast.sh).
[[lean_exe]]
name = "gen-guest-ast"
root = "Tools.GenGuestAst"

# `lake exe run-guest [input.bin] [fuel]` executes the guest under the stepped
# source semantics, as Guest.runGuestStepped defines it.
[[lean_exe]]
name = "run-guest"
root = "Tools.RunGuest"

# `lake exe trace-guest [input.bin]` locates the statement where a failing or
# exception-raising run goes wrong, descending through calls.
[[lean_exe]]
name = "trace-guest"
root = "Tools.TraceGuest"

# `lake exe frame-bound [N]` prints a source-level upper estimate
# of each function's stack frame (all variables spilled), see Tools/FrameBound.lean.
[[lean_exe]]
name = "frame-bound"
root = "Tools.FrameBound"

# `lake exe input-decode-check input.bin ...` checks Guest.declaredBlockGasLimit
# against the guest's own decode outcome (see Tools/InputDecodeCheck.lean).
[[lean_exe]]
name = "input-decode-check"
root = "Tools.InputDecodeCheck"

# `lake exe input-arena-check` checks that the guest rejects declared input
# lengths that cannot fit ZisK's input region (see Tools/InputArenaCheck.lean).
[[lean_exe]]
name = "input-arena-check"
root = "Tools.InputArenaCheck"

# `lake exe opcode-census` classifies every opcode handler as charging gas up
# front, ending its frame, or needing its branches examined (see Tools/OpcodeCensus.lean).
[[lean_exe]]
name = "opcode-census"
root = "Tools.OpcodeCensus"

# `lake exe accel-ffi-check` checks the byte-level accelerator specifications
# (Guest/AccelFfi.lean) against reference values.
[[lean_exe]]
name = "accel-ffi-check"
root = "Tools.AccelFfiCheck"

